<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Flashcard Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Weekly Flashcard Organizer</h1>
    </header>

    <div class="app-container">
        <aside class="task-pool">
            <h3>Create Task</h3>
            <form class="task-form" id="taskForm">
                <input type="text" id="taskTitle" placeholder="Task Title..." required>
                <textarea id="taskDesc" placeholder="Details/Notes..." rows="2"></textarea>
                <button type="submit">Add Flashcard</button>
            </form>
            
            <h3>Task Container</h3>
            <div class="pool-dropzone" id="poolDropzone">
                </div>
        </aside>

        <main class="schedule-grid">
            <div class="day-column">
                <h3>Monday</h3>
                <div class="day-dropzone" data-day="Monday"></div>
            </div>
            <div class="day-column">
                <h3>Tuesday</h3>
                <div class="day-dropzone" data-day="Tuesday"></div>
            </div>
            <div class="day-column">
                <h3>Wednesday</h3>
                <div class="day-dropzone" data-day="Wednesday"></div>
            </div>
            <div class="day-column">
                <h3>Thursday</h3>
                <div class="day-dropzone" data-day="Thursday"></div>
            </div>
            <div class="day-column">
                <h3>Friday</h3>
                <div class="day-dropzone" data-day="Friday"></div>
            </div>
            <div class="day-column">
                <h3>Saturday</h3>
                <div class="day-dropzone" data-day="Saturday"></div>
            </div>
            <div class="day-column">
                <h3>Sunday</h3>
                <div class="day-dropzone" data-day="Sunday"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
